name: Build immortalwrt-mt798x (AX3000T)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget curl libelf-dev ecj fastjar \
            java-propose-classpath

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 套用 AX3000 配置
        run: |
          cp defconfig/mt7981-ax3000.config .config
          make defconfig

      - name: 预下载源码包（失败也能继续）
        run: make download -j8 V=s || make download -j1 V=s || true

      - name: 编译
        run: make -j$(nproc) V=s || make -j1 V=s

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mt798x-ax3000t
          path: |
            bin/targets/mediatek/filogic/*.bin
            bin/targets/mediatek/filogic/*.itb
            bin/targets/mediatek/filogic/*.fip
            bin/targets/mediatek/filogic/*.manifest
            bin/targets/mediatek/filogic/sha256sums
          if-no-files-found: warn
          retention-days: 14
